<svg id="turpentine" style="cursor: pointer; border-radius: 5px" viewBox="0 0 200 70" width="200" height="70">
  <rect width="200" height="70" fill="rgb(255,255,255)"/>
  <rect width="70" height="70" fill="rgb(225,225,225)"/>
  <text x="132" y="18" fill="rgb(0,0,0)" text-anchor="middle" font-family="trebuchet ms" font-size="16.5px">
    Turpentine
  </text>
  <text x="133" y="38" fill="rgb(0,0,0)" text-anchor="middle" font-family="trebuchet ms" font-size="11.5px">
    A strong solvent that
  </text>
  <text x="133" y="52" fill="rgb(0,0,0)" text-anchor="middle" font-family="trebuchet ms" font-size="11.5px">
    can remove all waxes
  </text>
  <text x="133" y="65" fill="rgb(0,0,0)" text-anchor="middle" font-family="trebuchet ms" font-size="11.5px">
    from a bee's beequip.
  </text>
  <text id="turpentine_amount" x="67" y="67" fill="rgb(0,0,0)" text-anchor="end" font-family="calibri" font-size="14px"/>
  <g transform="translate(36,33) scale(0.85,0.85)">
