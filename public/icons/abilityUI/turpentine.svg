    <path stroke="rgb(200,0,0)" stroke-width="6" fill="rgb(0,0,0,0)" d="M -16 0 C -10 3 10 3 16 0"/>
    <path stroke="rgb(255,180,0)" stroke-width="3" fill="rgb(0,0,0,0)" d="M -5 -3 C -10 3 8 -8 5 -2M 0 -3 C 0 5 3 -2 -1 9"/>
